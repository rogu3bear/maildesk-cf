name = "maildesk-cf"
main = "workers/mail-api/src/index.ts"
compatibility_date = "2026-05-19"

[vars]
MAILDESK_POLICY_R2_KEY = "config/policy.json"

[[d1_databases]]
binding = "DB"
database_name = "maildesk-cf-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RAW_MAIL"
bucket_name = "maildesk-cf-raw-mail"

[[queues.producers]]
binding = "MAIL_JOBS"
queue = "maildesk-cf-jobs"

[[queues.consumers]]
queue = "maildesk-cf-jobs"
