# cf-rotate.conf — child tokens for this repo (engine: ~/dev/scripts/cf-rotate.sh)
# child|<env_key>|<ttl_days>|<Permission Group Name>;<...>   (exact CF group names)
# Scope = the account standard deploy set (Pages + Workers Scripts, read+write),
# matching every existing *-deploy token. Add D1/R2/KV Write ONLY if this repo
# mutates those via the token (e.g. wrangler d1 migrations apply) — bindings at
# runtime do NOT need token scope. A dry-run validates names vs the live inventory.
child|CLOUDFLARE_API_TOKEN|30|Workers Scripts Write;Workers Scripts Read;Pages Write;Pages Read
