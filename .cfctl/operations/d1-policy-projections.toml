schema_version = 1

[[operation]]
id = "maildesk-cf.d1-policy-project"
title = "Activate one private Maildesk policy revision"
description = "Apply one privately staged atomic route projection and verify only its route count and active policy, desired-state, and semantic projection digests."
config_template = "deploy/mail-router/wrangler.toml"
production_config = "deploy/mail-router/wrangler.production.toml"
database_binding = "DB"
wrangler_version = "4.110.0"
route_table = "alias_routes"
route_policy_sha_column = "policy_sha256"
runtime_state_table = "policy_projection_state"
runtime_state_key_column = "key"
runtime_state_value_column = "value"
active_policy_key = "active_policy_sha256"
desired_state_digest_key = "active_desired_state_sha256"
projection_digest_key = "active_projection_sha256"
recovery_capability_id = "d1-time-travel-get-bookmark"
recovery_max_age_seconds = 600
rollback_capability_id = "d1-restore-exact-bookmark"
