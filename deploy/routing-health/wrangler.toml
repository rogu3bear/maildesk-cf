name = "maildesk-cf-routing-health"
main = "../../build/_worker.js"
compatibility_date = "2026-08-12"
workers_dev = false
upload_source_maps = true

[build]
command = "bash scripts/build-ui-edge.sh"

[assets]
directory = "../../target/site"
binding = "ASSETS"

[vars]
MAILDESK_UI_AUTH_MODE = "access"
MAILDESK_UI_ACCESS_SCOPE = "desk_only"
MAILDESK_OPERATOR_DELIVERY_MODE = "inbox_relay"
MAILDESK_OUTBOUND_MODE = "disabled"

[[d1_databases]]
binding = "DB"
database_name = "maildesk-cf-relay-db"
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../migrations"
