name = "maildesk-cf-router"
main = "generated/mail-workers/mail-router/index.js"
compatibility_date = "2026-05-19"
workers_dev = false

send_email = [
  { name = "EMAIL" }
]

[build]
command = "bun run check:mail-worker-bundles"

[vars]
MAILDESK_OPERATOR_DELIVERY_MODE = "inbox_relay"
MAILDESK_INBOUND_RELAY_MODE = "disabled"
MAILDESK_REPLY_RELAY_MODE = "disabled"
MAILDESK_REPLY_DOMAIN = "reply.maildesk.example.com"
MAILDESK_REPLY_TOKEN_TTL_DAYS = "90"
MAILDESK_SPOOL_RETENTION_DAYS = "7"
MAILDESK_MAX_ENCODED_MESSAGE_BYTES = "5242880"

[[d1_databases]]
binding = "DB"
database_name = "maildesk-cf-relay-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "POLICY_STORE"
bucket_name = "maildesk-cf-policy"

[[r2_buckets]]
binding = "RELAY_SPOOL"
bucket_name = "maildesk-cf-relay-spool"

[[queues.producers]]
binding = "MAIL_JOBS"
queue = "maildesk-cf-relay-jobs"
