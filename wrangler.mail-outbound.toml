name = "maildesk-cf-relay-outbound"
main = "workers/mail-outbound/src/index.ts"
compatibility_date = "2026-08-12"
workers_dev = false
upload_source_maps = true

send_email = [
  { name = "EMAIL" }
]

[build]
command = "bun run build:router-wasm"

[vars]
MAILDESK_OPERATOR_DELIVERY_MODE = "inbox_relay"
MAILDESK_OUTBOUND_MODE = "disabled"
MAILDESK_VERIFIED_SENDER_DOMAINS = ""
MAILDESK_MAX_ENCODED_MESSAGE_BYTES = "5242880"

[[d1_databases]]
binding = "DB"
database_name = "maildesk-cf-relay-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "POLICY_STORE"
bucket_name = "maildesk-cf-policy"

[[r2_buckets]]
binding = "RELAY_SPOOL"
bucket_name = "maildesk-cf-relay-spool"

[[queues.consumers]]
queue = "maildesk-cf-relay-jobs"
max_batch_size = 1
max_concurrency = 1
max_retries = 5
dead_letter_queue = "maildesk-cf-relay-dlq"
