[package]
name = "maildesk-ui"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Leptos operator experience for the maildesk-cf Cloudflare mail desk."

[lints]
workspace = true

[workspace]
members = [
  "crates/maildesk-router",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/example/maildesk-cf"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.8", default-features = false, optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
leptos = { version = "0.8" }
leptos_axum = { version = "0.8.8", default-features = false, features = ["wasm"], optional = true }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
maildesk-router = { path = "crates/maildesk-router" }
send_wrapper = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-service = "0.3"
wasm-bindgen = "=0.2.118"
worker = { version = "0.7.5", features = ["http", "axum", "d1", "queue"], optional = true }

[features]
hydrate = [
  "dep:console_error_panic_hook",
  "leptos/hydrate",
]
ssr = [
  "dep:axum",
  "dep:leptos_axum",
  "dep:worker",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
]

[package.metadata.leptos]
output-name = "maildesk-ui"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "assets"
site-addr = "127.0.0.1:57591"
reload-port = 57592
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false

[profile.release]
codegen-units = 1
lto = true
strip = true
